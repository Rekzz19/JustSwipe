name: JusSwipe Image Push

on:
    push:
        branches:
            - main

permissions:
    contents: read
    id-token: write

jobs:
    jusswipe-docker:
        name: Build Docker Image
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::404420994114:role/github-images
                  aws-region: us-east-1

            - name: Log in to ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  ECR_REPOSITORY: jusswipe-image
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

#==========GITHUB STEPS============#
# GitHub workflows contain jobs, and each job contains its runner and steps.
# define when it runs on:
# then jobs : give the job a name first and where it runs then
